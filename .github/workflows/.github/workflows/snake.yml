name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # auto-refresh every 12 hours
  workflow_dispatch:          # lets you run it manually
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate orange snake from contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-orange.svg?color_snake=%23E85D2A&color_dots=%23161b22,%234a1e0f,%238f3c1c,%23c9511f,%23E85D2A

      - name: Push to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
